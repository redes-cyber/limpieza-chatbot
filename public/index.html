<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpieza Balear - Admin Bot</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --lb-sky-blue: #0ea5e9;
            --lb-sky-bg: #e0f2fe;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
        }
    </style>
</head>
<body class="text-gray-800">

<!-- PANEL DE CONTROL -->
<div id="dashboardScreen" class="min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-10 border-b border-sky-100">
        <div>
            <h1 class="text-2xl font-bold text-[#0ea5e9]">Limpieza Balear Bot</h1>
            <p class="text-sm text-gray-500">Administración en tiempo real</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                  <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                  <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-[#0ea5e9]"></span>
                </span>
                <span id="statusText" class="font-medium text-[#0ea5e9]">Online</span>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- PANEL IZQUIERDO: CONFIGURACIÓN -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col gap-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold border-b-2 border-[#0ea5e9] pb-2 inline-block">Configuración del Bot</h2>
                    <span id="saveStatus" class="text-sm font-medium text-green-500 opacity-0 transition-opacity">¡Guardado!</span>
                </div>
                
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700">System Prompt (Personalidad de Gemini)</label>
                    <textarea id="promptInput" rows="5" class="w-full px-4 py-3 border border-sky-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0ea5e9] resize-none bg-sky-50" placeholder="Eres el asistente inteligente..."></textarea>
                    <p class="text-xs text-gray-500 mt-1">Este es el contexto principal que la IA usará para responder a los clientes. (Aplica sin reiniciar el servidor).</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-semibold text-gray-600">API Key Gemini</label>
                        <input type="password" id="geminiKey" class="px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-[#0ea5e9]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-semibold text-gray-600">Meta Access Token</label>
                        <input type="password" id="metaToken" class="px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-[#0ea5e9]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-semibold text-gray-600">Phone Number ID</label>
                        <input type="text" id="phoneId" class="px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-[#0ea5e9]">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-semibold text-gray-600">Verify Token (Webhook)</label>
                        <input type="text" id="verifyToken" class="px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-[#0ea5e9]">
                    </div>
                </div>

                <button id="saveConfigBtn" class="mt-4 bg-[#0ea5e9] hover:bg-sky-600 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">
                    Guardar Configuración
                </button>
            </div>

            <!-- PANEL DERECHO: LOGS EN TIEMPO REAL -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col h-[600px]">
                <h2 class="text-xl font-bold border-b-2 border-[#0ea5e9] pb-2 mb-4 inline-block self-start">Registro de Mensajes (En Vivo)</h2>
                
                <div id="logsContainer" class="flex-1 overflow-y-auto w-full bg-gray-50 rounded-lg border border-gray-100 p-4 space-y-3 flex flex-col">
                    <!-- Los logs se insertan aquí vía JS -->
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
